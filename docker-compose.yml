services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_PATH: /app/data/app.db
    volumes:
      - cola-llamadas-data:/app/data
    expose:
      - "3000"

volumes:
  cola-llamadas-data:
